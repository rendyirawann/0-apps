# Transaksi Pekerjaan API — dipasang di bawah subfolder pada sebuah IP
#
#   http://203.0.113.10/transaksi
#
# Ganti 203.0.113.10 dengan IP server, dan `transaksi` dengan nama subfolder
# yang diinginkan. Nama subfolder harus sama persis di tiga tempat:
#   1. blok location di berkas ini
#   2. APP_URL di .env
#   3. L5_SWAGGER_CONST_HOST di .env
#
# ---------------------------------------------------------------------------
# TIDAK ADA FOLDER YANG DIBUAT DI DOCUMENT ROOT
# ---------------------------------------------------------------------------
# Ini bagian terpenting. `/transaksi` di sini BUKAN direktori di disk — ia
# hanya pola alamat yang diteruskan nginx ke Octane. Aplikasinya sendiri hidup
# di /var/www/o-api/current, di luar document root situs mana pun.
#
# Akibatnya: tidak ada folder bernama `transaksi` yang bisa terhapus oleh
# proses apa pun — bukan oleh deploy, bukan oleh `rm -rf` di web root, bukan
# oleh pembaruan situs lain di IP yang sama. Yang perlu dijaga hanyalah blok
# location ini tetap ada di konfigurasi nginx.
#
# Kalau nanti ternyata BENAR-BENAR ada direktori `transaksi` di web root milik
# aplikasi lain, pilih nama subfolder lain — jangan gabungkan keduanya.
# ---------------------------------------------------------------------------
#
# CARA PASANG
#
# A. Sudah ada situs lain di IP ini
#    Tempel bagian "POTONGAN UNTUK SERVER YANG SUDAH ADA" di bawah ke dalam
#    blok server yang sedang melayani IP tersebut. Jangan membuat blok server
#    baru untuk IP yang sama — nginx akan memilih salah satu saja sebagai
#    default_server dan situs yang lama bisa ikut mati.
#
# B. IP ini belum dipakai apa pun
#    Pakai berkas ini apa adanya:
#      cp ip-subfolder.conf /etc/nginx/sites-available/o-api-subfolder.conf
#      ln -s /etc/nginx/sites-available/o-api-subfolder.conf /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream o_api_octane {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    charset utf-8;

    access_log /var/log/nginx/o-api.access.log;
    error_log  /var/log/nginx/o-api.error.log;

    # ===================================================================
    # POTONGAN UNTUK SERVER YANG SUDAH ADA — salin mulai dari sini
    # ===================================================================

    # Tanpa garis miring di akhir, alamat relatif di halaman Swagger akan
    # dihitung dari root ("/docs") bukan dari subfolder ("/transaksi/docs").
    location = /transaksi {
        return 301 /transaksi/;
    }

    # `^~` WAJIB, bukan sekadar rapi.
    #
    # Tanpanya, location regex mana pun di server ini — misalnya
    # `location ~* \.(css|js|png)$` milik situs lama — akan menang atas
    # prefiks ini dan mencoba melayani aset Swagger UI dari disk. Berkasnya
    # tidak ada di sana, jadi hasilnya 404 tanpa penjelasan. `^~` menghentikan
    # pencarian regex begitu prefiks ini cocok.
    location ^~ /transaksi/ {
        # Garis miring di akhir proxy_pass inilah yang memotong prefiksnya:
        # /transaksi/api/health  ->  /api/health
        #
        # Jadi rute Laravel tidak perlu tahu apa-apa soal subfolder, dan
        # aplikasi yang sama bisa dipasang di domain sendiri tanpa diubah.
        proxy_pass http://o_api_octane/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Batas unggahan foto struk: 8 MB (LampiranRequest::MAKS_KB) + ruang
        # untuk pembungkus multipart. Bawaan nginx 1 MB akan menolaknya dengan
        # 413 sebelum permintaannya sampai ke Laravel, sehingga tidak ada
        # catatan apa pun di log Laravel.
        #
        # Ditulis di dalam location, bukan di server, supaya tidak mengubah
        # batas milik situs lain yang berbagi IP ini.
        client_max_body_size 12M;
        client_body_timeout  120s;

        # Unduhan PDF rekap bisa lama pada periode yang panjang.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # PDF dikirim utuh; buffering dimatikan supaya tidak menumpuk di
        # memori nginx dan byte pertama tidak tertunda.
        proxy_buffering         off;
        proxy_request_buffering off;

        # Catatan: add_header di dalam location MENGGANTI seluruh add_header
        # tingkat server, bukan menambah. Kalau server ini punya header
        # keamanan sendiri, salin juga ke sini atau header itu hilang khusus
        # untuk /transaksi/.
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ===================================================================
    # POTONGAN UNTUK SERVER YANG SUDAH ADA — sampai sini
    # ===================================================================

    # Di luar subfolder, IP ini tidak melayani apa pun. Hapus blok ini kalau
    # potongan di atas ditempel ke server milik situs lain.
    location / {
        return 404;
    }
}

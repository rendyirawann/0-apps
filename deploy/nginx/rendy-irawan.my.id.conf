# Transaksi Pekerjaan API — nginx di depan Laravel Octane
#
# Pasang di: /etc/nginx/sites-available/rendy-irawan.my.id.conf
# Aktifkan  : ln -s /etc/nginx/sites-available/rendy-irawan.my.id.conf \
#                   /etc/nginx/sites-enabled/
#
# nginx TIDAK menjalankan PHP di sini. Octane sudah menjadi server HTTP di
# 127.0.0.1:8000; tugas nginx hanya TLS, berkas statis, dan meneruskan sisanya.
# Karena itu tidak ada blok fastcgi/php-fpm sama sekali.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream o_api_octane {
    server 127.0.0.1:8000 fail_timeout=0;

    # Koneksi ditahan supaya tidak dibuka-tutup setiap permintaan.
    keepalive 32;
}

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name rendy-irawan.my.id www.rendy-irawan.my.id;

    # Dibiarkan di HTTP: certbot memakai jalur ini untuk memperbarui sertifikat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rendy-irawan.my.id$request_uri;
    }
}

# ------------------------------------------------------------- www -> non-www
# Satu alamat kanonik saja. Kalau www dan non-www sama-sama melayani API,
# token Sanctum dan CORS jadi punya dua asal yang berbeda.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.rendy-irawan.my.id;

    ssl_certificate     /etc/letsencrypt/live/rendy-irawan.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rendy-irawan.my.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://rendy-irawan.my.id$request_uri;
}

# -------------------------------------------------------------------- API
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name rendy-irawan.my.id;

    root  /var/www/o-api/current/public;
    index index.html;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/rendy-irawan.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rendy-irawan.my.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Batas ukuran unggahan
    #
    # WAJIB dinaikkan. Aplikasi menerima foto struk sampai 8 MB
    # (LampiranRequest::MAKS_KB = 8192), sedangkan bawaan nginx hanya 1 MB.
    # Tanpa baris ini, unggahan struk ditolak 413 oleh nginx dan permintaannya
    # tidak pernah sampai ke Laravel — jadi tidak ada pesan galat yang berguna
    # di aplikasi maupun di log Laravel.
    #
    # 12M memberi ruang untuk overhead multipart di atas 8 MB berkasnya.
    client_max_body_size 12M;
    client_body_timeout  120s;

    # ---- Header keamanan: TIDAK dipasang di sini
    #
    # Seluruhnya dikirim aplikasi (App\Http\Middleware\SecurityHeaders).
    # Kalau nginx ikut memasangnya, browser menerima DUA nilai untuk header
    # yang sama -- X-Frame-Options ganda dianggap tidak sah dan diabaikan,
    # sehingga perlindungannya justru hilang.
    #
    # HSTS juga ikut dari aplikasi, dan hanya saat permintaannya benar-benar
    # lewat HTTPS.

    # ---- Log
    access_log /var/log/nginx/o-api.access.log;
    error_log  /var/log/nginx/o-api.error.log;

    # ---- Kompresi
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css text/plain
                    image/svg+xml application/xml;

    # ---- Berkas yang tidak boleh diakses
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Foto struk TIDAK berada di public/, jadi tidak mungkin terjangkau dari
    # sini. Blok ini sekadar pengaman kalau suatu saat ada yang membuat
    # symlink storage/ ke public/ tanpa sadar isinya bukti keuangan.
    location ^~ /storage/lampiran {
        deny all;
    }

    # ---- Aset statis milik Swagger UI dan sejenisnya
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri @octane;
    }

    # ---- Sisanya ke Octane
    location / {
        try_files $uri @octane;
    }

    location @octane {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Unduhan PDF laporan bisa memakan waktu pada rekap besar.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # PDF dikirim sekaligus; buffering dimatikan agar tidak menumpuk di
        # memori nginx dan tidak menunda byte pertama.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass http://o_api_octane;
    }
}
